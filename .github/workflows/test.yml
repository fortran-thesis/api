name: Run Tests

on:
  push:
    branches: [main, add]
  pull_request:
    branches: [main, add]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: api/functions

      - name: Run tests
        run: npm test
        working-directory: api/functions
