name: Run Tests

on:
  push:
    branches: [main, add]
  pull_request:
    branches: [main, add]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Start Firebase Emulator
        run: |
          nohup firebase emulators:start --only firestore,auth --project demo-project &
          sleep 10
        working-directory: functions

      - name: Set Firestore emulator env
        run: echo "FIRESTORE_EMULATOR_HOST=localhost:8080" >> $GITHUB_ENV
      
      - name: Set Google Cloud Project
        run: echo "GOOGLE_CLOUD_PROJECT=demo-project" >> $GITHUB_ENV

      - name: Set Redis env
        run: |
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV

      - name: Set fake encryption key
        run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Set MailHog email env (for CI)
        run: echo "USE_MAILHOG=true" >> $GITHUB_ENV

      - name: Run tests
        run: npm test
        working-directory: functions
