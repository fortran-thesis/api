name: Run Tests

on:
  push:
    branches: [add, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies, Firebase CLI and start Firebase Emulators
        run: |
          npm install -g firebase-tools
          npm ci
          nohup firebase emulators:start --only firestore,auth,storage --project demo-project &
          sleep 10
        working-directory: functions

      - name: Load .env.test
        run: cat functions/.env.test >> $GITHUB_ENV

      - name: Run tests
        run: npm test
        working-directory: functions
